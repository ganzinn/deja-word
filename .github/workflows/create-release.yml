name: Create Release

# production デプロイの単一エントリポイント。
# このワークフローを手動実行（Run workflow）するだけで:
#   1. rel-YYYYMMDDHHmm 形式のタグで GitHub Release を作成し
#   2. 続けて Release Deploy（reusable workflow）を呼び出して production にデプロイする。
#
# 実行ブランチ（既定 main）の HEAD commit が対象になる。
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "補足ノート（任意）。自動生成ノートの先頭に追記される"
        required: false
        default: ""

permissions:
  contents: write # タグと Release の作成に必要

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: タイムスタンプタグを生成 (JST)
        id: tag
        run: |
          TAG="rel-$(TZ=Asia/Tokyo date +%Y%m%d%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "生成タグ: $TAG"

      # --generate-notes で UI の「Generate release notes」と同じ自動生成ノートを付与する。
      # 補足ノート（inputs.notes）が入力された場合は自動生成ノートの先頭に追記される。
      # inputs は env 経由で渡す（run スクリプトへ直接展開しないインジェクション対策）。
      - name: GitHub Release を作成（ノート自動生成）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes --notes "$NOTES"
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          fi

  # GITHUB_TOKEN で作成した Release は release:published を再発火しないため、
  # ここで Release Deploy を直接呼び出して deploy をつなぐ。
  deploy:
    needs: create-release
    uses: ./.github/workflows/release-deploy.yml
    secrets: inherit
